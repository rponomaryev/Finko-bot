name: Publisher Tests

on:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
    paths:
      - "publisher/**"
      - ".github/workflows/publisher-tests.yml"
  pull_request:
    paths:
      - "publisher/**"
      - ".github/workflows/publisher-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run publisher tests
        run: pytest -q
